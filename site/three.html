<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 首帧底色：样式表到达之前也不出现白底/无样式闪现 -->
    <style>
      html { background: #f8fafc; }
      html.dark { background: #0b101b; }
      body { margin: 0; background: inherit; }
    </style>
    <title>s3m-three - 渲染内核 API 参考</title>
    <meta
      name="description"
      content="SuperMap S3M/S3MB 三维瓦片格式的 three.js 渲染内核：宿主无关的解析、瓦片树与 S3MViewer API 参考"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('s3m_doc_theme');
          var dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <!--s3m-hydration-->
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <!--s3m-page-data-->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3M 宿主切换 — 同一份 CBD 模型跑在 MapLibre / Mapbox 任意版本</title>
    <meta
      name="description"
      content="一个独立页面：同一份 SuperMap S3M 的 CBD 模型，可以在 MapLibre GL 与 Mapbox GL 的不同版本之间切换，用于对照两家的渲染、投影与图层顺序差异。"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b101b;
        font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #e2e8f0;
      }
      #map {
        position: absolute;
        inset: 0;
        background: #0b101b;
      }

      /* 顶部切换条：52px 以下，给页面级演示切换栏让位；放右侧，不挡 CBD 楼群 */
      #bar {
        position: absolute;
        top: 52px;
        right: 12px;
        z-index: 6;
        width: 336px;
        padding: 12px 13px;
        border-radius: 12px;
        background: rgba(13, 20, 32, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 18px 36px -10px rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(16px);
      }
      #bar h1 {
        margin: 0 0 9px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #94a3b8;
        text-transform: uppercase;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-bottom: 7px;
      }
      .row > select {
        flex: 0 0 auto;
        max-width: 140px;
      }
      .row > input {
        flex: 1 1 auto;
        min-width: 0;
      }
      select,
      input,
      button {
        font: inherit;
        font-size: 12px;
        padding: 5px 8px;
        border-radius: 6px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: #0f172a;
        color: #e2e8f0;
        outline: none;
      }
      input::placeholder {
        color: #64748b;
      }
      select:focus,
      input:focus {
        border-color: #38bdf8;
      }
      button {
        cursor: pointer;
        background: rgba(56, 189, 248, 0.14);
        border-color: rgba(56, 189, 248, 0.4);
        color: #7dd3fc;
        font-weight: 600;
      }
      button:hover {
        background: rgba(56, 189, 248, 0.22);
        color: #fff;
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 9px 0 0;
      }
      .presets button {
        font-size: 11px;
        font-weight: 500;
        padding: 3px 8px;
        background: rgba(148, 163, 184, 0.1);
        border-color: rgba(148, 163, 184, 0.25);
        color: #cbd5e1;
      }
      .presets button.active {
        background: rgba(14, 165, 233, 0.9);
        border-color: #0ea5e9;
        color: #04121f;
        font-weight: 600;
      }

      /* 底部 HUD：引擎、版本、图层顺序、瓦片统计 */
      #hud {
        position: absolute;
        bottom: 12px;
        left: 12px;
        z-index: 6;
        padding: 9px 12px;
        border-radius: 9px;
        background: rgba(13, 20, 32, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.25);
        font-size: 11.5px;
        line-height: 1.75;
        white-space: pre-line;
        max-width: min(560px, calc(100% - 24px));
        backdrop-filter: blur(10px);
      }
      #hud b {
        color: #38bdf8;
      }
      #hud .warn {
        color: #fbbf24;
      }

      #fail {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 8;
        width: min(440px, calc(100% - 48px));
        padding: 18px 20px;
        border-radius: 12px;
        background: rgba(13, 20, 32, 0.94);
        border: 1px solid rgba(248, 113, 113, 0.45);
        font-size: 12.5px;
        line-height: 1.8;
      }
      #fail[hidden] {
        display: none;
      }
      #fail b {
        color: #fca5a5;
      }
      #fail code {
        color: #fca5a5;
        word-break: break-all;
      }
      #fail a {
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="bar"></div>
    <div id="hud">正在加载 CBD 数据集…</div>
    <div id="fail" hidden></div>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>

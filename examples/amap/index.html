<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3M × 高德地图 (AMap) 最小集成 Demo (Phase 2)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #container { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; }
    #panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      max-width: 380px;
      font-size: 13px;
      color: #333;
      line-height: 1.6;
    }
    #panel h3 { margin-bottom: 8px; font-size: 15px; color: #111; }
    #panel .form-row { margin-bottom: 10px; }
    #panel label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 12px; color: #555; }
    #panel input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }
    #panel button {
      background: #1890ff;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    #panel button:hover { background: #40a9ff; }
    #status-box {
      margin-top: 10px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #52c41a;
      color: #fff;
      border-radius: 3px;
      font-size: 10px;
      margin-left: 6px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../../demo/vendor/three.module.js",
        "s3m-three": "../../packages/s3m-three/dist/index.js"
      }
    }
  </script>
</head>
<body>
  <div id="container"></div>

  <div id="panel">
    <h3>S3M × 高德地图 <span class="badge">Phase 2 WebGL2</span></h3>
    <p style="color: #666; margin-bottom: 12px;">基于独立 WebGL2 覆盖层与 <code>customCoords</code> 纯净 MVP 对齐。</p>

    <div class="form-row">
      <label>高德 Web JS API Key</label>
      <input type="text" id="key-input" placeholder="输入高德 Key 或使用 URL 参数 ?key=..." value="42d4710e7910e812317872aecf857535" />
    </div>

    <div class="form-row">
      <label>高德安全密钥 Security Code（可选）</label>
      <input type="text" id="sec-input" placeholder="若配置了安全密钥，请输入或 ?code=..." />
    </div>

    <div class="form-row">
      <label>S3M 数据集 URL (.scp / 根瓦片)</label>
      <input type="text" id="url-input" placeholder="../../demo/data/CBD/cbd.scp" value="../../demo/data/CBD/cbd.scp" />
    </div>

    <div class="form-row" style="display: flex; gap: 8px;">
      <button id="load-btn">加载地图与模型</button>
      <button id="reset-cam-btn" style="background: #555;">重置视角</button>
    </div>

    <div id="status-box">准备就绪。点击“加载地图与模型”开始渲染。</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { AMapS3MLayer } from './AMapS3MLayer.js';

    const urlParams = new URLSearchParams(window.location.search);
    const keyInput = document.getElementById('key-input');
    const secInput = document.getElementById('sec-input');
    const urlInput = document.getElementById('url-input');
    const statusBox = document.getElementById('status-box');

    // 默认值 / 记忆
    if (urlParams.get('key')) keyInput.value = urlParams.get('key');
    if (urlParams.get('code')) secInput.value = urlParams.get('code');
    if (urlParams.get('url')) urlInput.value = urlParams.get('url');

    function log(msg) {
      statusBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      statusBox.scrollTop = statusBox.scrollHeight;
    }

    let map = null;
    let s3mLayer = null;

    function initAMap(key, code) {
      if (code) {
        window._AMapSecurityConfig = { securityJsCode: code };
      }
      if (window.AMap) {
        startMap();
        return;
      }
      log('正在加载高德 JS API v2.0...');
      const script = document.createElement('script');
      script.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(key)}`;
      script.onload = () => {
        log('高德 API 加载成功');
        startMap();
      };
      script.onerror = () => {
        log('高德 API 加载失败，请检查 Key 与安全密钥');
      };
      document.head.appendChild(script);
    }

    function startMap() {
      if (map) return;
      log('初始化高德 3D 地图...');
      map = new AMap.Map('container', {
        viewMode: '3D',
        center: [116.464129, 39.915287], // 北京 CBD 央视大楼 GCJ-02 POI 中心点
        zoom: 16.5,
        pitch: 60,
        rotation: 30,
      });

      map.on('complete', () => {
        log('底图就绪，挂载 AMapS3MLayer...');
        mountS3MLayer();
      });
    }

    function mountS3MLayer() {
      if (s3mLayer) return;

      s3mLayer = new AMapS3MLayer({
        id: 's3m-layer',
        lightingPreset: 'supermap',
        onPick: (hit) => {
          log(`拾取单体: ${hit ? `objectId=${hit.objectId}, batchId=${hit.batchId}` : '未命中'}`);
        },
        onReady: (entry) => {
          log(`数据集就绪: 瓦片数=${entry.tileset ? 1 : 0}`);
        },
      });

      // 挂载到地图（自动创建 WebGL2 覆盖画布）
      s3mLayer.setMap(map);
      log('AMapS3MLayer (WebGL2) 已挂载');

      const s3mUrl = urlInput.value.trim();
      if (s3mUrl) {
        log(`加载 S3M 模型: ${s3mUrl}`);
        s3mLayer.viewer.addDataset({ id: 'cbd', configUrl: s3mUrl });
      }
    }

    document.getElementById('load-btn').addEventListener('click', () => {
      const key = keyInput.value.trim();
      const code = secInput.value.trim();
      if (!key) {
        alert('请先输入高德 Web JS API Key');
        return;
      }
      initAMap(key, code);
    });

    document.getElementById('reset-cam-btn').addEventListener('click', () => {
      if (map) {
        map.setZoomAndCenter(16.5, [116.464129, 39.915287]);
        map.setPitch(60);
        map.setRotation(30);
      }
    });

    // 默认自启动加载
    if (keyInput.value) {
      initAMap(keyInput.value, secInput.value);
    }
  </script>
</body>
</html>

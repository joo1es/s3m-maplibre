<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3M × 高德地图 (AMap JS API v2) 示例</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #container { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 200;
      width: 340px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      font-size: 13px;
      color: #333;
    }
    #panel h3 { margin-bottom: 10px; font-size: 15px; color: #111; }
    .form-row { margin-bottom: 10px; }
    .form-row label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 12px; color: #555; }
    .form-row input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      font-size: 12px;
    }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1;
      padding: 7px 12px;
      background: #1677ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 12px;
    }
    button:hover { background: #0958d9; }
    button.secondary { background: #666; }
    button.secondary:hover { background: #444; }
    #status-box {
      margin-top: 12px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #00b96b;
      color: #fff;
      border-radius: 3px;
      font-size: 10px;
      margin-left: 6px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../../demo/vendor/three.module.js",
        "s3m-three": "../../packages/s3m-three/dist/index.js"
      }
    }
  </script>
</head>
<body>
  <div id="container"></div>

  <div id="panel">
    <h3>S3M × 高德地图 <span class="badge">WebGL2</span></h3>
    <p style="color: #666; margin-bottom: 12px;">基于独立 WebGL2 覆盖层与 <code>customCoords</code> 对齐高德底图。</p>

    <div class="form-row">
      <label>高德 Web JS API Key</label>
      <input type="text" id="key-input" placeholder="输入高德 Key 或使用 URL 参数 ?key=..." value="" />
    </div>
    <div class="form-row">
      <label>安全密钥 (securityJsCode)</label>
      <input type="text" id="sec-input" placeholder="输入安全密钥或 ?code=..." value="" />
    </div>
    <div class="form-row">
      <label>S3M 数据集配置 (config / scp URL)</label>
      <input type="text" id="url-input" value="../../demo/data/CBD/cbd.scp" />
    </div>

    <div class="btn-row">
      <button id="load-btn">加载底图与 S3M</button>
      <button id="reset-cam-btn" class="secondary">重置视角</button>
    </div>

    <div id="status-box">等待初始化...</div>
  </div>

  <script type="module">
    import { AMapS3MLayer } from './AMapS3MLayer.js';

    const urlParams = new URLSearchParams(window.location.search);
    const keyInput = document.getElementById('key-input');
    const secInput = document.getElementById('sec-input');
    const urlInput = document.getElementById('url-input');
    const statusBox = document.getElementById('status-box');

    // 取景中心采用高德 POI「央视大楼」GCJ-02 坐标；面板位于左侧，center 略微西移以便模型完整露出
    const CBD_VIEW = {
      center: [Number(urlParams.get('lng') || 116.4625), Number(urlParams.get('lat') || 39.915287)],
      zoom: Number(urlParams.get('zoom') || 17.5),
      pitch: Number(urlParams.get('pitch') || 50),
      rotation: Number(urlParams.get('rotation') || 0),
      showBuildingBlock: urlParams.get('block') === '1',
    };

    if (urlParams.get('key')) keyInput.value = urlParams.get('key');
    if (urlParams.get('code')) secInput.value = urlParams.get('code');
    if (urlParams.get('url')) urlInput.value = urlParams.get('url');

    let map = null;
    let s3mLayer = null;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      statusBox.innerHTML += `<div>[${time}] ${msg}</div>`;
      statusBox.scrollTop = statusBox.scrollHeight;
      console.log(`[s3m-amap] ${msg}`);
    }

    function applyView() {
      if (!map) return;
      map.setStatus({
        center: CBD_VIEW.center,
        zoom: CBD_VIEW.zoom,
        pitch: CBD_VIEW.pitch,
        rotation: CBD_VIEW.rotation,
        showBuildingBlock: CBD_VIEW.showBuildingBlock,
      });
    }

    function loadAMapSDK(key, securityJsCode) {
      return new Promise((resolve, reject) => {
        if (window.AMap) {
          resolve(window.AMap);
          return;
        }
        if (securityJsCode) {
          window._AMapSecurityConfig = { securityJsCode };
        }
        const script = document.createElement('script');
        script.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(key)}`;
        script.onload = () => resolve(window.AMap);
        script.onerror = (err) => reject(new Error('高德 SDK 脚本加载失败，请检查 Key 或网络连接'));
        document.head.appendChild(script);
      });
    }

    async function initApp() {
      const key = keyInput.value.trim();
      const code = secInput.value.trim();
      if (!key) {
        log('请先填写高德 JS API Key');
        return;
      }

      if (map) {
        if (s3mLayer) {
          s3mLayer.destroy();
          s3mLayer = null;
        }
        map.destroy();
        map = null;
      }

      log('正在加载高德地图 JS API v2...');
      try {
        await loadAMapSDK(key, code);
      } catch (e) {
        log(`错误: ${e.message}`);
        return;
      }

      log('初始化高德 3D 地图...');
      map = new AMap.Map('container', {
        viewMode: '3D',
        showBuildingBlock: CBD_VIEW.showBuildingBlock,
        center: CBD_VIEW.center,
        zoom: CBD_VIEW.zoom,
        pitch: CBD_VIEW.pitch,
        rotation: CBD_VIEW.rotation,
      });

      map.on('complete', () => {
        applyView();
        log('底图就绪，挂载 AMapS3MLayer...');
        mountS3MLayer();
      });
    }

    function mountS3MLayer() {
      if (s3mLayer) return;

      s3mLayer = new AMapS3MLayer({
        id: 's3m-layer',
        onPick: (hit) => {
          log(`拾取单体: ${hit ? `objectId=${hit.objectId}, batchId=${hit.batchId}` : '未命中'}`);
        },
        onReady: (entry) => {
          log(`数据集就绪: ${entry.id}, 锚点=(${entry.anchor?.lon?.toFixed(5)}, ${entry.anchor?.lat?.toFixed(5)})`);
        },
        onError: (err) => {
          log(`渲染器异常: ${err?.message || err}`);
        },
      });

      s3mLayer.setMap(map);
      log('AMapS3MLayer (WebGL2) 已挂载');

      const s3mUrl = urlInput.value.trim();
      if (s3mUrl) {
        log(`加载 S3M 模型: ${s3mUrl}`);
        s3mLayer.viewer.addDataset({ id: 'cbd', configUrl: s3mUrl });
      }
    }

    document.getElementById('load-btn').addEventListener('click', () => {
      initApp();
    });

    document.getElementById('reset-cam-btn').addEventListener('click', () => {
      applyView();
    });

    initApp();
  </script>
</body>
</html>

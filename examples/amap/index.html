<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3M × 高德地图 (AMap) 最小集成 Demo (Phase 2)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #container { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; }
    #panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      max-width: 380px;
      font-size: 13px;
      color: #333;
      line-height: 1.6;
    }
    #panel h3 { margin-bottom: 8px; font-size: 15px; color: #111; }
    #panel .form-row { margin-bottom: 10px; }
    #panel label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 12px; color: #555; }
    #panel input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }
    #panel button {
      background: #1890ff;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    #panel button:hover { background: #40a9ff; }
    #status-box {
      margin-top: 10px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #52c41a;
      color: #fff;
      border-radius: 3px;
      font-size: 10px;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <div id="panel">
    <h3>S3M × 高德地图 <span class="badge">Phase 2</span></h3>
    <p style="color: #666; margin-bottom: 12px;">基于 <code>AMap.GLCustomLayer</code> 共享 WebGL Context 与 <code>customCoords</code> 透视相机对齐。</p>

    <div class="form-row">
      <label>高德 Web JS API Key</label>
      <input type="text" id="key-input" placeholder="输入高德 Key 或使用 URL 参数 ?key=..." />
    </div>

    <div class="form-row">
      <label>S3M 数据集 URL (.scp / 根瓦片)</label>
      <input type="text" id="url-input" placeholder="http://.../config.scp" />
    </div>

    <div class="form-row" style="display: flex; gap: 8px;">
      <button id="load-btn">加载地图与模型</button>
      <button id="reset-cam-btn" style="background: #555;">重置视角</button>
    </div>

    <div id="status-box">准备就绪。请输入高德 API Key 并点击加载。</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { AMapS3MLayer } from './AMapS3MLayer.ts';

    const urlParams = new URLSearchParams(window.location.search);
    const keyInput = document.getElementById('key-input');
    const urlInput = document.getElementById('url-input');
    const statusBox = document.getElementById('status-box');

    // 默认值 / 记忆
    keyInput.value = urlParams.get('key') || localStorage.getItem('amap_key') || '';
    urlInput.value = urlParams.get('url') || localStorage.getItem('s3m_url') || '';

    function log(msg) {
      statusBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      statusBox.scrollTop = statusBox.scrollHeight;
    }

    let map = null;
    let s3mLayer = null;

    function initAMap(key) {
      if (window.AMap) {
        startMap();
        return;
      }
      log('正在加载高德 JS API v2.0...');
      const script = document.createElement('script');
      script.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(key)}`;
      script.onload = () => {
        log('高德 API 加载成功');
        startMap();
      };
      script.onerror = () => {
        log('高德 API 加载失败，请检查 Key 与安全密钥');
      };
      document.head.appendChild(script);
    }

    function startMap() {
      if (map) return;
      log('初始化高德 3D 地图...');
      map = new AMap.Map('container', {
        viewMode: '3D',
        center: [116.39126, 39.90700],
        zoom: 16,
        pitch: 55,
        rotation: -15,
      });

      map.on('complete', () => {
        log('底图就绪，挂载 AMapS3MLayer...');
        mountS3MLayer();
      });
    }

    function mountS3MLayer() {
      s3mLayer = new AMapS3MLayer({
        id: 's3m-layer',
        onPick: (hit) => {
          log(`拾取单体: ${hit ? `pickId=${hit.pickId}` : '未命中'}`);
        },
        onReady: (entry) => {
          log(`数据集就绪: 瓦片数=${entry.tileset ? 1 : 0}`);
        },
      });

      const glCustomLayer = new AMap.GLCustomLayer({
        zIndex: 120,
        init: (gl) => {
          s3mLayer.init(map, gl);
          const s3mUrl = urlInput.value.trim();
          if (s3mUrl) {
            log(`加载 S3M 模型: ${s3mUrl}`);
            s3mLayer.viewer.addDataset({ url: s3mUrl });
          }
        },
        render: () => {
          s3mLayer.render();
        },
      });

      map.add(glCustomLayer);
      log('GLCustomLayer 已添加到地图');
    }

    document.getElementById('load-btn').addEventListener('click', () => {
      const key = keyInput.value.trim();
      const s3mUrl = urlInput.value.trim();
      if (!key) {
        alert('请先输入高德 Web JS API Key');
        return;
      }
      localStorage.setItem('amap_key', key);
      localStorage.setItem('s3m_url', s3mUrl);
      initAMap(key);
    });

    document.getElementById('reset-cam-btn').addEventListener('click', () => {
      if (map) {
        map.setZoomAndCenter(16, [116.39126, 39.90700]);
        map.setPitch(55);
        map.setRotation(-15);
      }
    });

    // 若 URL 已带 key，自动启动
    if (keyInput.value) {
      initAMap(keyInput.value);
    }
  </script>
</body>
</html>

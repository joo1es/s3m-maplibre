    <style>html,body{color:#e2e8f0;background:#0b101b;height:100%;margin:0;font:13px/1.5 -apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;overflow:hidden}#map{background:#0b101b;position:absolute;inset:0}#bar{z-index:6;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);background:#0d1420e0;border:1px solid #94a3b840;border-radius:12px;width:336px;padding:12px 13px;position:absolute;top:52px;right:12px;box-shadow:0 18px 36px -10px #000000a6}#bar h1{letter-spacing:.04em;color:#94a3b8;text-transform:uppercase;margin:0 0 9px;font-size:12px;font-weight:600}.row{gap:6px;margin-bottom:7px;display:flex}.row>select{flex:none;max-width:140px}.row>input{flex:auto;min-width:0}select,input,button{font:inherit;color:#e2e8f0;background:#0f172a;border:1px solid #94a3b859;border-radius:6px;outline:none;padding:5px 8px;font-size:12px}input::placeholder{color:#64748b}select:focus,input:focus{border-color:#38bdf8}button{cursor:pointer;color:#7dd3fc;background:#38bdf824;border-color:#38bdf866;font-weight:600}button:hover{color:#fff;background:#38bdf838}.presets{flex-wrap:wrap;gap:5px;margin:9px 0 0;display:flex}.presets button{color:#cbd5e1;background:#94a3b81a;border-color:#94a3b840;padding:3px 8px;font-size:11px;font-weight:500}.presets button.active{color:#04121f;background:#0ea5e9e6;border-color:#0ea5e9;font-weight:600}#hud{z-index:6;white-space:pre-line;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:#0d1420e0;border:1px solid #94a3b840;border-radius:9px;max-width:min(560px,100% - 24px);padding:9px 12px;font-size:11.5px;line-height:1.75;position:absolute;bottom:12px;left:12px}#hud b{color:#38bdf8}#hud .warn{color:#fbbf24}#fail{z-index:8;background:#0d1420f0;border:1px solid #f8717173;border-radius:12px;width:min(440px,100% - 48px);padding:18px 20px;font-size:12.5px;line-height:1.8;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}#fail[hidden]{display:none}#fail b{color:#fca5a5}#fail code{color:#fca5a5;word-break:brea

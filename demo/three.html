<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3M × 纯 three.js（不依赖 MapLibre）</title>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; }
      body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      canvas { display: block; }

      #panel {
        position: absolute; top: 14px; left: 14px; z-index: 5;
        width: 250px; padding: 12px 14px;
        color: #e6edf7; font-size: 12px;
        background: rgba(17, 25, 38, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 10px;
        backdrop-filter: blur(8px);
      }
      #panel h1 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
      #panel .sub { color: #7d8da4; font-size: 11px; margin-bottom: 10px; line-height: 1.5; }
      #panel .row { display: flex; gap: 6px; margin-bottom: 8px; }
      #panel select, #panel button {
        font: inherit; font-size: 11.5px; color: #e6edf7;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px; padding: 4px 8px; cursor: pointer; outline: none;
      }
      #panel select { flex: 1; }
      #panel button.on { background: #1d4ed8; border-color: #3b82f6; }
      #stats { color: #8fa1b8; font-size: 11px; line-height: 1.7; }
      #stats b { color: #dbe6f5; font-weight: 600; }
      #hint {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
        color: #93a3b8; font-size: 11.5px; white-space: nowrap;
        background: rgba(17, 25, 38, 0.7); padding: 5px 12px; border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>S3M × 纯 three.js</h1>
      <div class="sub">只有一个 three.js 场景，没有地图、没有 MapLibre。<br /><a href="./index.html" style="color:#60a5fa; text-decoration:none;">← MapLibre 版</a></div>
      <div class="row">
        <select id="ds">
          <option value="cbd" selected>北京CBD (CCTV)</option>
          <option value="comModel">comModel (样例)</option>
          <option value="subwayCrn">地铁站 (CRN 纹理)</option>
        </select>
      </div>
      <div class="row">
        <button id="mTexture" class="on">原色</button>
        <button id="mWhite">白膜</button>
        <button id="mBatch">按单体</button>
      </div>
      <div id="stats">瓦片 <b id="stTiles">0</b> · 三角面 <b id="stTris">0</b> · 帧率 <b id="stFps">—</b></div>
    </div>
    <div id="hint">左键拖拽旋转 · 右键拖拽平移 · 滚轮缩放</div>
    <script type="module" src="./three.js"></script>
  </body>
</html>

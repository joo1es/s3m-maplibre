<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3M for MapLibre — 原生解析 · 叠加 · 着色 · 单体拾取</title>
    <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js", "s3m-three": "../packages/s3m-three/dist/index.js" } }
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b101b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #e2e8f0;
        -webkit-font-smoothing: antialiased;
      }
      #map { position: absolute; inset: 0; background: #0b101b; }

      /* 自定义精致滚动条 */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

      /* 毛玻璃主卡片 */
      .card {
        background: rgba(13, 20, 32, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      /* ---------- 左侧主控制面板 ---------- */
      #panel {
        position: absolute; top: 16px; left: 16px; z-index: 5;
        width: 316px; padding: 16px;
        font-size: 12px; color: #cbd5e1;
        max-height: calc(100% - 32px); overflow-y: auto;
      }

      /* 统一品牌顶栏 */
      .brand-bar {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 10px;
      }
      .brand-title {
        display: flex; align-items: center; gap: 8px;
        font-size: 14px; font-weight: 700; color: #f8fafc; letter-spacing: -0.01em;
      }
      .brand-icon {
        width: 26px; height: 26px; border-radius: 7px;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; box-shadow: 0 4px 10px rgba(6, 182, 212, 0.3);
      }
      .version-tag {
        font-size: 10.5px; font-mono: ui-monospace, monospace; font-weight: 600;
        padding: 2px 6px; border-radius: 6px;
        background: rgba(56, 189, 248, 0.12); color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.25);
      }

      /* 导航胶囊导航条 */
      .nav-pills {
        display: flex; gap: 5px; margin-bottom: 14px; padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .nav-pill {
        flex: 1; text-align: center; padding: 5px 0; border-radius: 6px;
        font-size: 11px; text-decoration: none; font-weight: 500;
        background: rgba(255, 255, 255, 0.04); color: #94a3b8;
        border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.15s ease;
      }
      .nav-pill:hover {
        background: rgba(255, 255, 255, 0.08); color: #f8fafc;
        border-color: rgba(255, 255, 255, 0.16);
      }
      .nav-pill.active {
        background: rgba(56, 189, 248, 0.15); color: #38bdf8;
        border-color: rgba(56, 189, 248, 0.35); font-weight: 600;
      }

      #panel section { margin-bottom: 14px; }
      #panel h2 {
        margin: 0 0 8px; font-size: 10.5px; font-weight: 600; color: #64748b;
        text-transform: uppercase; letter-spacing: 0.06em;
        display: flex; align-items: center; gap: 6px;
      }
      #panel h2::before {
        content: ''; width: 3px; height: 10px; border-radius: 2px;
        background: #38bdf8; display: inline-block;
      }

      /* URL 输入框 & 预设胶囊 */
      .url-box { display: flex; gap: 6px; margin-bottom: 7px; }
      .url-box input, .form-input {
        flex: 1; min-width: 0; padding: 6px 9px; font-size: 11.5px;
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 6px; outline: none;
        background: rgba(255, 255, 255, 0.04); color: #f8fafc; transition: all 0.15s;
      }
      .url-box input:focus, .form-input:focus {
        border-color: #38bdf8; background: rgba(15, 23, 42, 0.95);
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
      }
      .btn {
        padding: 5px 10px; font-size: 11px; font-weight: 500; cursor: pointer;
        border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06); color: #e2e8f0;
        transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .btn-primary {
        background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: 600;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
      }
      .btn-primary:hover { background: #0ea5e9; border-color: #7dd3fc; }
      .btn-danger {
        background: rgba(239, 68, 68, 0.14); border-color: rgba(239, 68, 68, 0.35);
        color: #fca5a5;
      }
      .btn-danger:hover { background: rgba(239, 68, 68, 0.25); color: #fff; }

      .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
      .presets button {
        padding: 3px 8px; font-size: 10.5px; cursor: pointer; border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.09); background: rgba(255, 255, 255, 0.04);
        color: #94a3b8; transition: all 0.15s;
      }
      .presets button:hover {
        border-color: rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.08);
        color: #f1f5f9;
      }
      .presets button.active {
        border-color: #38bdf8; background: rgba(56, 189, 248, 0.14);
        color: #38bdf8; font-weight: 600;
      }

      /* 数据集复选列表 */
      .ds {
        display: flex; align-items: center; gap: 8px; padding: 6px 8px;
        border-radius: 6px; cursor: pointer; margin-bottom: 3px;
        background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.04);
        transition: all 0.12s;
      }
      .ds:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.08); }
      .ds input { margin: 0; accent-color: #38bdf8; cursor: pointer; }
      .ds .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cbd5e1; font-size: 11.5px; }
      .ds .tag { color: #64748b; font-size: 10.5px; font-variant-numeric: tabular-nums; flex: none; font-family: ui-monospace, monospace; }
      .ds .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

      /* 着色模式分段按钮 */
      .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
      .seg button {
        padding: 6px 3px; font-size: 11px; cursor: pointer; border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.03);
        color: #94a3b8; transition: all 0.15s; font-weight: 500;
      }
      .seg button:hover { border-color: rgba(255, 255, 255, 0.18); color: #f1f5f9; background: rgba(255, 255, 255, 0.06); }
      .seg button.on {
        background: #0284c7; color: #fff; border-color: #38bdf8;
        font-weight: 600; box-shadow: 0 0 12px rgba(56, 189, 248, 0.28);
      }

      /* 调色板拾取器 */
      .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 9px; align-items: center; }
      .swatches label { display: flex; align-items: center; gap: 6px; color: #94a3b8; font-size: 11px; cursor: pointer; }
      .swatches input[type=color] {
        width: 24px; height: 20px; padding: 0; border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px; background: none; cursor: pointer;
      }
      .swatches.hide { display: none; }

      /* 通用复选框与滑块 */
      .chk { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; color: #cbd5e1; font-size: 11.5px; }
      .chk input { margin: 0; accent-color: #38bdf8; cursor: pointer; }

      .rng { display: flex; align-items: center; gap: 8px; padding: 3px 0 5px; color: #94a3b8; font-size: 11.5px; }
      .rng input[type=range] { flex: 1; accent-color: #38bdf8; height: 16px; cursor: pointer; }
      .rng b {
        color: #38bdf8; font-weight: 600; font-family: ui-monospace, monospace;
        font-size: 11px; width: 44px; text-align: right;
        background: rgba(56, 189, 248, 0.08); padding: 2px 4px; border-radius: 4px;
        border: 1px solid rgba(56, 189, 248, 0.15);
      }

      /* 现代下拉选框 */
      .form-select {
        padding: 4px 8px; font-size: 11.5px; border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px; background: #0f172a; color: #f8fafc; outline: none;
      }
      .form-select:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

      #legend { margin-top: 9px; }
      #legend .bar { height: 6px; border-radius: 3px; }
      #legend .lab { display: flex; justify-content: space-between; color: #64748b; font-size: 10px; margin-top: 3px; font-family: ui-monospace, monospace; }

      /* 底部微型仪表盘 */
      #panel footer {
        border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 10px; margin-top: 6px;
        display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; font-size: 11px;
      }
      .stat-chip {
        display: flex; justify-content: space-between; align-items: center;
        background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 6px; padding: 5px 8px; color: #64748b;
      }
      .stat-chip b { color: #f8fafc; font-weight: 600; font-family: ui-monospace, monospace; font-size: 11px; }

      /* 状态与指示灯 */
      #status {
        display: flex; align-items: center; gap: 7px; margin-top: 10px;
        color: #94a3b8; font-size: 11px; padding: 4px 6px;
        background: rgba(255, 255, 255, 0.02); border-radius: 6px;
      }
      #dot { width: 6px; height: 6px; border-radius: 50%; background: #64748b; flex: none; }
      #dot.busy { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; animation: pulse 1s infinite; }
      #dot.ok { background: #10b981; box-shadow: 0 0 8px #10b981; }
      #dot.err { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
      @keyframes pulse { 50% { opacity: 0.3; } }

      /* ---------- 右侧单体属性卡 ---------- */
      #feature {
        position: absolute; right: 18px; bottom: 18px; z-index: 6;
        width: 290px; padding: 16px; font-size: 12px;
        transform: translateY(14px) scale(0.98); opacity: 0; pointer-events: none;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        border-color: rgba(56, 189, 248, 0.3);
      }
      #feature.on { transform: none; opacity: 1; pointer-events: auto; }
      #feature .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      #feature .hd b { font-size: 13.5px; color: #f8fafc; font-family: ui-monospace, monospace; }
      #feature .close { cursor: pointer; color: #64748b; font-size: 18px; line-height: 1; transition: color 0.15s; }
      #feature .close:hover { color: #f8fafc; }
      #feature .kv { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
      #feature .kv span:first-child { color: #64748b; font-size: 11px; }
      #feature .kv span:last-child { font-variant-numeric: tabular-nums; font-weight: 550; color: #cbd5e1; font-size: 11px; }
      #feature .note {
        margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.08);
        color: #64748b; font-size: 10.5px; line-height: 1.5;
      }

      /* 单体独立定制样式卡 */
      .feat-custom { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 7px; }
      .feat-custom-hd { display: flex; justify-content: space-between; align-items: center; }
      .feat-custom-hd span:first-child { font-weight: 600; font-size: 11px; color: #f1f5f9; }
      .feat-row { display: flex; gap: 6px; align-items: center; }
      .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
      .btn-danger:hover { background: rgba(239, 68, 68, 0.25); border-color: rgba(239, 68, 68, 0.5); }

      /* 底部中心操作提示胶囊 */
      #hint {
        position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 4;
        color: #94a3b8; font-size: 11.5px; background: rgba(13, 20, 32, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
        padding: 6px 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px); white-space: nowrap; pointer-events: none;
      }

      /* 跟随系统的浅色模式 (Light Mode) */
      @media (prefers-color-scheme: light) {
        html, body, #map { background: #f1f5f9; color: #1e293b; }
        .card { background: rgba(255, 255, 255, 0.88); border-color: rgba(0, 0, 0, 0.08); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04); }
        .brand-title { color: #0f172a; }
        #panel { color: #334155; }
        #panel h2 { color: #475569; border-top-color: rgba(0, 0, 0, 0.06); }
        .nav-pills { background: rgba(0, 0, 0, 0.04); border-color: rgba(0, 0, 0, 0.06); }
        .nav-pill { color: #64748b; }
        .nav-pill:hover { color: #0f172a; background: rgba(0, 0, 0, 0.04); }
        .url-box input, .form-select { background: #ffffff; color: #0f172a; border-color: #cbd5e1; }
        .preset-chip { background: #ffffff; border-color: #e2e8f0; color: #334155; }
        .preset-chip:hover { border-color: #0284c7; color: #0284c7; }
        .seg { background: rgba(0, 0, 0, 0.05); border-color: rgba(0, 0, 0, 0.08); }
        .seg button { color: #64748b; }
        .seg button:hover { color: #0f172a; }
        .btn { background: #ffffff; border-color: #cbd5e1; color: #334155; }
        .btn:hover { background: #f8fafc; color: #0f172a; }
        label.chk, label.rng { color: #334155; }
        label.rng b { color: #0f172a; }
        .stat-chip { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.05); color: #64748b; }
        .stat-chip b { color: #0f172a; }
        #status { background: rgba(0, 0, 0, 0.03); color: #475569; }
        #hint { background: rgba(255, 255, 255, 0.92); border-color: rgba(0, 0, 0, 0.1); color: #475569; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); }
        #feature .hd b { color: #0f172a; }
        #feature .kv span:last-child { color: #0f172a; }
        .feat-custom-hd span:first-child { color: #0f172a; }
        #panel footer { border-top-color: rgba(0, 0, 0, 0.06); }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="panel" class="card">
      <div class="brand-bar">
        <div class="brand-title">
          <span class="brand-icon">🏢</span>
          <span>s3m-maplibre</span>
        </div>
        <span class="version-tag" id="versionTag"></span>
      </div>

      <div class="nav-pills">
        <span class="nav-pill active">🗺️ MapLibre</span>
        <a href="./three.html" class="nav-pill">🧊 Three.js 版</a>
        <a href="../docs/index.html" class="nav-pill">📚 开发文档</a>
      </div>

      <section>
        <h2>数据源 / URL</h2>
        <div class="url-box">
          <input type="text" id="urlInput" placeholder="输入 .scp 地址或 iServer 服务路径..." spellcheck="false" />
          <button id="btnLoad" class="btn btn-primary">加载</button>
        </div>
        <div class="presets" id="presets"></div>
      </section>

      <section>
        <h2>数据集叠加</h2>
        <div id="datasets"></div>
      </section>

      <section>
        <h2>着色模式</h2>
        <div class="seg" id="modes"></div>
        <div class="swatches" id="swatches">
          <label id="wrapCA"><input type="color" id="cA" value="#dfe6ee" /><span id="lblCA">底色</span></label>
          <label id="wrapCB"><input type="color" id="cB" value="#1d4ed8" /><span id="lblCB">渐变</span></label>
          <label id="wrapCC"><input type="color" id="cC" value="#fbbf24" /><span id="lblCC">扫描</span></label>
        </div>
        <div id="legend" class="hide"></div>
      </section>

      <section>
        <h2>质感与高程</h2>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
          <span style="color:#94a3b8; font-size:11.5px;">垂直对齐</span>
          <select id="optAlign" class="form-select">
            <option value="origin" selected>原生原点 (Origin)</option>
            <option value="top">顶面对齐 (Top·地下工程)</option>
            <option value="bottom">底面对齐 (Bottom·地上建筑)</option>
            <option value="center">中心对齐 (Center)</option>
          </select>
        </div>
        <label class="rng">
          <span>高程调整</span>
          <input type="range" id="optHeightOffset" min="-50" max="50" step="0.5" value="0" />
          <b id="heightOffsetVal">0m</b>
        </label>
        <label class="rng">
          <span>不透明度</span>
          <input type="range" id="optOpacity" min="20" max="100" step="1" value="100" />
          <b id="opacityVal">100%</b>
        </label>
        <label class="chk"><input type="checkbox" id="optFlat" checked /> 平面着色（白模更干净）</label>
        <label class="chk"><input type="checkbox" id="optBlendTex" /> 叠加在模型原色贴图上</label>
        <label class="rng" id="wrapTexMix" style="display:none; margin-top: 2px;">
          <span>叠加强度</span>
          <input type="range" id="optTexMix" min="10" max="100" step="5" value="80" />
          <b id="texMixVal">80%</b>
        </label>
      </section>

      <section>
        <h2>地形 (MapLibre Terrain)</h2>
        <label class="chk"><input type="checkbox" id="optTerrain" /> 开启真实地形（AWS Terrarium DEM）</label>
        <label class="rng">
          <span>垂直夸张</span>
          <input type="range" id="optExagg" min="1" max="5" step="0.5" value="1" />
          <b id="exaggVal">1×</b>
        </label>
        <label class="chk"><input type="checkbox" id="optTerrainShade" checked /> 地形阴影 (hillshade)</label>
        <label class="chk"><input type="checkbox" id="optTerrainSnap" checked /> 建筑贴地（自动对齐 DEM 高程）</label>
        <div id="terrainInfo" style="font-size:10.5px;color:#64748b;margin-top:4px;">未开启</div>
      </section>

      <section>
        <h2>环境与投影</h2>
        <label class="chk"><input type="checkbox" id="optUnderground" /> 地下透视模式（半透明地表）</label>
        <label class="chk"><input type="checkbox" id="optHideBasemap" /> 隐藏地图底图</label>
        <label class="chk"><input type="checkbox" id="optOrtho" /> 正交投影（工程俯视/轴测）</label>
      </section>

      <section>
        <h2>选中与高亮</h2>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
          <span style="color:#94a3b8; font-size:11.5px;">高亮模式</span>
          <select id="optSelMode" class="form-select">
            <option value="overlay" selected>叠加原图 (Overlay)</option>
            <option value="replace">纯色覆盖 (Replace)</option>
            <option value="multiply">叠乘模式 (Multiply)</option>
            <option value="glowOnly">仅描边发光 (Glow)</option>
          </select>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
          <span style="color:#94a3b8; font-size:11.5px;">高亮颜色</span>
          <input type="color" id="optSelColor" value="#22d3ee" style="width:26px; height:20px; border:1px solid rgba(255,255,255,0.2); border-radius:4px; padding:0; cursor:pointer; background:none;" />
        </div>
        <label class="rng" id="wrapSelOpacity">
          <span>叠色浓度</span>
          <input type="range" id="optSelOpacity" min="10" max="100" step="5" value="65" />
          <b id="selOpacityVal">65%</b>
        </label>
        <label class="rng">
          <span>单体拔高</span>
          <input type="range" id="optSelElevation" min="0" max="40" step="1" value="0" />
          <b id="selElevationVal">0m</b>
        </label>
        <label class="chk"><input type="checkbox" id="optOutline" checked /> 选中单体描边</label>
        <div id="wrapOutlineOpts" style="margin: 2px 0 6px 18px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <span style="color:#94a3b8; font-size:11px;">画法</span>
            <select id="optOutlineStyle" class="form-select" style="padding: 2px 5px; font-size: 11px;">
              <option value="edges" selected>棱线（单体折边）</option>
              <option value="hull">外扩轮廓</option>
            </select>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <span style="color:#94a3b8; font-size:11px;">描边颜色</span>
            <input type="color" id="optOutlineColor" value="#22d3ee" style="width:24px; height:18px; border:1px solid rgba(255,255,255,0.2); border-radius:4px; padding:0; cursor:pointer; background:none;" />
          </div>
          <label class="rng" id="wrapOutlineWidthPx" style="padding:0;">
            <span style="font-size:11px;">棱线粗细</span>
            <input type="range" id="optOutlineWidthPx" min="10" max="80" step="5" value="30" />
            <b id="outlineWidthPxVal">3.0px</b>
          </label>
          <label class="rng" id="wrapOutlineWidth" style="padding:0; display:none;">
            <span style="font-size:11px;">外扩粗细</span>
            <input type="range" id="optOutlineWidth" min="2" max="30" step="1" value="9" />
            <b id="outlineWidthVal">0.9m</b>
          </label>
        </div>
        <label class="chk"><input type="checkbox" id="optDim" checked /> 选中时压暗其他</label>
        <label class="chk"><input type="checkbox" id="optEdges" /> 全局棱线</label>
        <label class="rng" id="wrapEdgeOpacity" style="display:none; margin-top: 4px;">
          <span>棱线透明度</span>
          <input type="range" id="optEdgeOpacity" min="10" max="100" step="5" value="45" />
          <b id="edgeOpacityVal">45%</b>
        </label>
        <label class="rng" id="wrapEdgeWidth" style="display:none; margin-top: 4px;">
          <span>棱线粗细</span>
          <input type="range" id="optEdgeWidth" min="10" max="60" step="5" value="12" />
          <b id="edgeWidthVal">1.2px</b>
        </label>
        <label class="chk"><input type="checkbox" id="optOccludeBack" checked /> 遮挡内部与背面线条 (深度防透)</label>
      </section>

      <section>
        <h2>单体过滤与筛选 (Filter)</h2>
        <div style="display: flex; gap: 5px; margin-bottom: 6px;">
          <button id="btnFilterIsolate" class="btn" style="flex:1;">仅看选中</button>
          <button id="btnFilterHide" class="btn btn-danger" style="flex:1;">隐藏选中</button>
          <button id="btnFilterReset" class="btn" style="flex:1;">恢复全显</button>
        </div>
        <label class="rng">
          <span>高度上限</span>
          <input type="range" id="optFilterMaxH" min="10" max="250" step="5" value="250" />
          <b id="filterMaxHVal">全部</b>
        </label>
        <div id="filterStatus" style="font-size: 11px; color: #64748b; margin-top: 3px; min-height: 16px;"></div>
      </section>

      <section>
        <h2>按业务字段（着色 / 过滤 / 抬高）</h2>
        <input id="optAttrUrl" type="text" class="form-input" placeholder="数据服务地址 .../rest/data"
          style="width: 100%; margin-bottom: 5px;" />
        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
          <input id="optAttrDataset" type="text" class="form-input" placeholder="DataSource:zhoubian"
            style="flex: 1; min-width: 0;" />
          <button id="btnAttrFields" class="btn">读字段</button>
        </div>
        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
          <select id="optAttrField" class="form-select" style="flex: 1; min-width: 0;">
            <option value="">先点「读字段」</option>
          </select>
          <select id="optAttrType" class="form-select">
            <option value="category" selected>分类</option>
            <option value="ramp">渐变</option>
            <option value="breaks">分级</option>
          </select>
        </div>
        <div style="display: flex; gap: 5px;">
          <button id="btnAttrApply" class="btn btn-primary" style="flex: 1;">按字段上色</button>
          <button id="btnAttrClear" class="btn">清除</button>
        </div>
        <div id="attrLegend" style="margin-top: 6px; font-size: 11px; color: #cbd5e1; max-height: 132px; overflow-y: auto;"></div>
        <div id="attrStatus" style="font-size: 11px; color: #64748b; margin-top: 3px; min-height: 16px;"></div>

        <div style="margin-top: 8px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.08);">
          <div style="font-size: 11px; color: #64748b; margin-bottom: 4px;">过滤区间（数值字段，留空为不限）</div>
          <div style="display: flex; gap: 5px; margin-bottom: 5px;">
            <input id="optAttrMin" type="number" class="form-input" placeholder="min" style="flex: 1; min-width: 0;" />
            <input id="optAttrMax" type="number" class="form-input" placeholder="max" style="flex: 1; min-width: 0;" />
            <select id="optAttrFilterMode" class="form-select">
              <option value="keep" selected>保留匹配</option>
              <option value="hide">隐藏匹配</option>
            </select>
          </div>
          <div style="display: flex; gap: 5px; margin-bottom: 7px;">
            <button id="btnAttrFilter" class="btn btn-primary" style="flex: 1;">按字段过滤</button>
            <button id="btnAttrFilterClear" class="btn">全部显示</button>
          </div>
          <div style="font-size: 11px; color: #64748b; margin-bottom: 4px;">抬高倍率（米 / 字段单位）</div>
          <div style="display: flex; gap: 5px;">
            <input id="optAttrElev" type="number" step="0.5" value="1" class="form-input" style="width: 70px;" />
            <button id="btnAttrElevate" class="btn" style="flex: 1; border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.12); color: #34d399;">按字段抬高</button>
            <button id="btnAttrElevReset" class="btn">复位</button>
          </div>
        </div>
      </section>

      <footer>
        <div class="stat-chip"><span>瓦片</span><b id="stTiles">0</b></div>
        <div class="stat-chip"><span>网格</span><b id="stMeshes">0</b></div>
        <div class="stat-chip"><span>三角面</span><b id="stTris">0</b></div>
        <div class="stat-chip"><span>帧率</span><b id="stFps">—</b></div>
      </footer>
      <div id="status"><span id="dot"></span><span id="statusText">初始化…</span></div>
    </div>

    <div id="feature" class="card"></div>
    <div id="hint">左键旋转 · 右键平移 · 滚轮缩放 · 点击建筑查看属性</div>

    <script src="./vendor/maplibre-gl.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3M for MapLibre — 原生解析 · 叠加 · 着色 · 单体拾取</title>
    <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      #map { position: absolute; inset: 0; background: #eef1f5; }

      .card {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #e2e6ec;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(16, 24, 40, 0.10);
        backdrop-filter: blur(8px);
      }

      /* ---------- 左侧控制面板 ---------- */
      #panel {
        position: absolute; top: 16px; left: 16px; z-index: 5;
        width: 292px; padding: 16px 16px 12px;
        font-size: 12.5px; color: #1f2937;
        max-height: calc(100% - 32px); overflow-y: auto;
      }
      #panel h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: .1px; }
      #panel h1 span { font-weight: 400; color: #9aa4b2; font-size: 11px; margin-left: 6px; }
      #panel .sub { color: #7b8794; font-size: 11.5px; margin: 3px 0 14px; }
      #panel section { margin-bottom: 14px; }
      #panel h2 {
        margin: 0 0 7px; font-size: 11px; font-weight: 600; color: #8b95a3;
        text-transform: uppercase; letter-spacing: .6px;
      }

      /* URL 输入框 & 预设 */
      .url-box { display: flex; gap: 6px; margin-bottom: 6px; }
      .url-box input {
        flex: 1; min-width: 0; padding: 5px 8px; font-size: 11.5px;
        border: 1px solid #d1d5db; border-radius: 6px; outline: none;
        background: #f9fafb; color: #111827;
      }
      .url-box input:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }
      .url-box button {
        padding: 5px 10px; font-size: 11.5px; font-weight: 500; cursor: pointer;
        background: #1f2937; color: #fff; border: none; border-radius: 6px; flex: none;
        transition: .15s;
      }
      .url-box button:hover { background: #374151; }
      .presets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
      .presets button {
        padding: 3px 6px; font-size: 10.5px; cursor: pointer; border-radius: 4px;
        border: 1px solid #e5e7eb; background: #f3f4f6; color: #4b5563; transition: .12s;
      }
      .presets button:hover { border-color: #9ca3af; background: #e5e7eb; color: #111827; }
      .presets button.active { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; font-weight: 600; }

      .ds { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
      .ds input { margin: 0; accent-color: #1f2937; }
      .ds .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ds .tag { color: #9aa4b2; font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
      .ds .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

      .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
      .seg button {
        padding: 6px 2px; font-size: 11.5px; cursor: pointer; border-radius: 7px;
        border: 1px solid #e2e6ec; background: #fff; color: #46505d; transition: .12s;
      }
      .seg button:hover { border-color: #c3cad4; }
      .seg button.on { background: #1f2937; color: #fff; border-color: #1f2937; }

      .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; align-items: center; }
      .swatches label { display: flex; align-items: center; gap: 5px; color: #7b8794; font-size: 11px; }
      .swatches input[type=color] {
        width: 26px; height: 20px; padding: 0; border: 1px solid #dfe3e8; border-radius: 5px;
        background: none; cursor: pointer;
      }
      .swatches.hide { display: none; }

      .chk { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
      .chk input { margin: 0; accent-color: #1f2937; }

      .rng { display: flex; align-items: center; gap: 8px; padding: 2px 0 6px; color: #7b8794; }
      .rng input[type=range] { flex: 1; accent-color: #1f2937; height: 16px; }
      .rng b { color: #1f2937; font-weight: 550; font-variant-numeric: tabular-nums; width: 34px; text-align: right; }

      #legend { margin-top: 9px; }
      #legend .bar { height: 8px; border-radius: 4px; }
      #legend .lab { display: flex; justify-content: space-between; color: #9aa4b2; font-size: 10.5px; margin-top: 3px; }

      #panel footer {
        border-top: 1px solid #eef0f3; padding-top: 9px; margin-top: 4px;
        display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; color: #7b8794; font-size: 11.5px;
      }
      #panel footer b { color: #1f2937; font-weight: 550; font-variant-numeric: tabular-nums; }

      #status { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: #7b8794; font-size: 11.5px; }
      #dot { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; flex: none; }
      #dot.busy { background: #d97706; animation: pulse 1s infinite; }
      #dot.ok { background: #059669; }
      #dot.err { background: #dc2626; }
      @keyframes pulse { 50% { opacity: .3; } }

      /* ---------- 右侧属性卡 ---------- */
      #feature {
        position: absolute; right: 16px; bottom: 16px; z-index: 6;
        width: 268px; padding: 14px 16px; font-size: 12.5px;
        transform: translateY(12px); opacity: 0; pointer-events: none;
        transition: .18s ease;
      }
      #feature.on { transform: none; opacity: 1; pointer-events: auto; }
      #feature .hd { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
      #feature .hd b { font-size: 14px; }
      #feature .hd span { color: #9aa4b2; font-size: 11px; }
      #feature .kv { display: flex; justify-content: space-between; padding: 3px 0; }
      #feature .kv span:first-child { color: #7b8794; }
      #feature .kv span:last-child { font-variant-numeric: tabular-nums; font-weight: 550; }
      #feature .note { margin-top: 9px; padding-top: 8px; border-top: 1px solid #eef0f3; color: #9aa4b2; font-size: 10.5px; line-height: 1.5; }
      #feature .close { cursor: pointer; color: #9aa4b2; font-size: 16px; line-height: 1; }

      #hint {
        position: absolute; bottom: 18px; left: 300px; z-index: 4;
        color: #8b95a3; font-size: 11.5px; background: rgba(255,255,255,.8);
        padding: 5px 10px; border-radius: 7px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="panel" class="card">
      <h1>S3M for MapLibre<span>v0.2.4</span></h1>
      <div class="sub">SuperMap S3M 原生解析 · 无需转换 3D Tiles · <a href="./three.html" style="color:#2563eb; text-decoration:none;">纯 three.js 版 →</a></div>

      <section>
        <h2>数据源 / URL</h2>
        <div class="url-box">
          <input type="text" id="urlInput" placeholder="输入 .scp 地址或 iServer 服务路径..." spellcheck="false" />
          <button id="btnLoad">加载</button>
        </div>
        <div class="presets" id="presets"></div>
      </section>

      <section>
        <h2>数据集叠加</h2>
        <div id="datasets"></div>
      </section>

      <section>
        <h2>着色模式</h2>
        <div class="seg" id="modes"></div>
        <div class="swatches" id="swatches">
          <label id="wrapCA"><input type="color" id="cA" value="#dfe6ee" /><span id="lblCA">底色</span></label>
          <label id="wrapCB"><input type="color" id="cB" value="#1d4ed8" /><span id="lblCB">渐变</span></label>
          <label id="wrapCC"><input type="color" id="cC" value="#fbbf24" /><span id="lblCC">扫描</span></label>
        </div>
        <div id="legend" class="hide"></div>
      </section>

      <section>
        <h2>质感与高程</h2>
        <label class="rng">
          <span>高程调整</span>
          <input type="range" id="optHeightOffset" min="-50" max="50" step="0.5" value="0" />
          <b id="heightOffsetVal">0m</b>
        </label>
        <label class="rng">
          <span>不透明度</span>
          <input type="range" id="optOpacity" min="20" max="100" step="1" value="100" />
          <b id="opacityVal">100%</b>
        </label>
        <label class="chk"><input type="checkbox" id="optFlat" checked /> 平面着色（白模更干净）</label>
        <label class="chk"><input type="checkbox" id="optBlendTex" /> 叠加在模型原色贴图上</label>
        <label class="rng" id="wrapTexMix" style="display:none; margin-top: 2px;">
          <span>叠加强度</span>
          <input type="range" id="optTexMix" min="10" max="100" step="5" value="80" />
          <b id="texMixVal">80%</b>
        </label>
      </section>

      <section>
        <h2>选中与高亮</h2>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
          <span style="color:#7b8794; font-size:11.5px;">高亮模式</span>
          <select id="optSelMode" style="padding: 3px 6px; font-size: 11.5px; border: 1px solid #d1d5db; border-radius: 5px; background: #fff; color: #111827; outline: none;">
            <option value="overlay" selected>叠加原图 (Overlay)</option>
            <option value="replace">纯色覆盖 (Replace)</option>
            <option value="multiply">叠乘模式 (Multiply)</option>
            <option value="glowOnly">仅描边发光 (Glow)</option>
          </select>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
          <span style="color:#7b8794; font-size:11.5px;">高亮颜色</span>
          <input type="color" id="optSelColor" value="#22d3ee" style="width:26px; height:20px; border:1px solid #dfe3e8; border-radius:4px; padding:0; cursor:pointer;" />
        </div>
        <label class="rng" id="wrapSelOpacity">
          <span>叠色浓度</span>
          <input type="range" id="optSelOpacity" min="10" max="100" step="5" value="65" />
          <b id="selOpacityVal">65%</b>
        </label>
        <label class="rng">
          <span>单体拔高</span>
          <input type="range" id="optSelElevation" min="0" max="40" step="1" value="0" />
          <b id="selElevationVal">0m</b>
        </label>
        <label class="chk"><input type="checkbox" id="optOutline" checked /> 选中单体描边</label>
        <div id="wrapOutlineOpts" style="margin: 2px 0 6px 18px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <span style="color:#7b8794; font-size:11px;">画法</span>
            <select id="optOutlineStyle" style="padding: 2px 5px; font-size: 11px; border: 1px solid #d1d5db; border-radius: 5px; background: #fff; color: #111827; outline: none;">
              <option value="edges" selected>棱线（单体折边）</option>
              <option value="hull">外扩轮廓</option>
            </select>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <span style="color:#7b8794; font-size:11px;">描边颜色</span>
            <input type="color" id="optOutlineColor" value="#22d3ee" style="width:24px; height:18px; border:1px solid #dfe3e8; border-radius:4px; padding:0; cursor:pointer;" />
          </div>
          <label class="rng" id="wrapOutlineWidthPx" style="padding:0;">
            <span style="font-size:11px;">棱线粗细</span>
            <input type="range" id="optOutlineWidthPx" min="10" max="80" step="5" value="30" />
            <b id="outlineWidthPxVal">3.0px</b>
          </label>
          <label class="rng" id="wrapOutlineWidth" style="padding:0; display:none;">
            <span style="font-size:11px;">外扩粗细</span>
            <input type="range" id="optOutlineWidth" min="2" max="30" step="1" value="9" />
            <b id="outlineWidthVal">0.9m</b>
          </label>
        </div>
        <label class="chk"><input type="checkbox" id="optDim" checked /> 选中时压暗其他</label>
        <label class="chk"><input type="checkbox" id="optEdges" /> 全局棱线</label>
        <label class="rng" id="wrapEdgeOpacity" style="display:none; margin-top: 4px;">
          <span>棱线透明度</span>
          <input type="range" id="optEdgeOpacity" min="10" max="100" step="5" value="45" />
          <b id="edgeOpacityVal">45%</b>
        </label>
        <label class="rng" id="wrapEdgeWidth" style="display:none; margin-top: 4px;">
          <span>棱线粗细</span>
          <input type="range" id="optEdgeWidth" min="10" max="60" step="5" value="12" />
          <b id="edgeWidthVal">1.2px</b>
        </label>
        <label class="chk"><input type="checkbox" id="optOccludeBack" checked /> 遮挡内部与背面线条 (深度防透)</label>
      </section>

      <section>
        <h2>单体过滤与筛选 (Filter)</h2>
        <div style="display: flex; gap: 5px; margin-bottom: 6px;">
          <button id="btnFilterIsolate" style="flex: 1; padding: 5px 4px; font-size: 11px; border: 1px solid #d1d5db; border-radius: 5px; background: #f9fafb; color: #374151; cursor: pointer; transition: .12s;">仅看选中</button>
          <button id="btnFilterHide" style="flex: 1; padding: 5px 4px; font-size: 11px; border: 1px solid #d1d5db; border-radius: 5px; background: #f9fafb; color: #dc2626; cursor: pointer; transition: .12s;">隐藏选中</button>
          <button id="btnFilterReset" style="flex: 1; padding: 5px 4px; font-size: 11px; border: 1px solid #d1d5db; border-radius: 5px; background: #f9fafb; color: #374151; cursor: pointer; transition: .12s;">恢复全显</button>
        </div>
        <label class="rng">
          <span>高度上限</span>
          <input type="range" id="optFilterMaxH" min="10" max="250" step="5" value="250" />
          <b id="filterMaxHVal">全部</b>
        </label>
        <div id="filterStatus" style="font-size: 11px; color: #6b7280; margin-top: 3px; min-height: 16px;"></div>
      </section>

      <footer>
        <div>瓦片 <b id="stTiles">0</b></div>
        <div>网格 <b id="stMeshes">0</b></div>
        <div>三角面 <b id="stTris">0</b></div>
        <div>帧率 <b id="stFps">—</b></div>
      </footer>
      <div id="status"><span id="dot"></span><span id="statusText">初始化…</span></div>
    </div>

    <div id="feature" class="card"></div>
    <div id="hint">左键旋转 · 右键平移 · 滚轮缩放 · 点击建筑查看属性</div>

    <script src="./vendor/maplibre-gl.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>

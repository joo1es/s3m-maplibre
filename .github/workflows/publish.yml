name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm publish & OIDC provenance)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm (for Trusted Publishing OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies via Bun
        run: bun install --frozen-lockfile

      # monorepo：s3m-maplibre 是面向使用方的发布包，标签版本与它对齐
      - name: Verify tag matches s3m-maplibre version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./packages/s3m-maplibre/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::标签 v$TAG 与 packages/s3m-maplibre 的版本 $PKG 不一致，已终止发布"
            exit 1
          fi
          echo "版本一致：v$PKG"

      - name: Build and typecheck
        run: |
          npm run build
          npm run typecheck

      # 先发渲染内核，再发依赖它的适配层
      - name: Publish s3m-three to npm
        run: npm publish --access public --provenance
        working-directory: packages/s3m-three
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # prepublishOnly 会把 workspace:* 依赖替换成正式版本号后再发布
      - name: Publish s3m-maplibre to npm
        run: npm publish --access public --provenance
        working-directory: packages/s3m-maplibre
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true

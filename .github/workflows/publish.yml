name: Publish to npm

on:
  push:
    tags:
      # 按包打标签：s3m-three@0.1.0 只发内核，s3m-maplibre@0.3.0 只发图层
      - 's3m-three@*'
      - 's3m-maplibre@*'
      # v* 是 s3m-maplibre 的 legacy 别名（0.2.x 时代的习惯），继续可用
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: '要发布的包'
        required: true
        default: 's3m-maplibre'
        type: choice
        options:
          - 's3m-three'
          - 's3m-maplibre'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm publish & OIDC provenance)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm (for Trusted Publishing OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies via Bun
        run: bun install --frozen-lockfile

      # 测试不能只靠发版前的人肉纪律：tag 可以打在没跑过测试的 commit 上。
      # 与 ci.yml 同款稀疏拉取：整仓 712MB，只取 data/ 这 1.4MB 官方样例。
      - name: Fetch s3m-spec sample data
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SuperMap/s3m-spec.git "$RUNNER_WORKSPACE/s3m-spec"
          git -C "$RUNNER_WORKSPACE/s3m-spec" sparse-checkout set S3M_SDK/S3M_JS/data
          find "$RUNNER_WORKSPACE/s3m-spec/S3M_SDK/S3M_JS/data" -name '*.s3mb' | wc -l

      # S3M_REQUIRE_SAMPLES=1：样例没拉到就判失败，而不是悄悄 skip 掉整组解析断言
      - name: Unit tests
        run: bun test
        env:
          S3M_REQUIRE_SAMPLES: '1'

      # 标签 → 发布哪个包。s3m-maplibre 是面向使用方的发布包，v* legacy 别名指向它
      - name: Resolve target package from tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKG="${{ inputs.package }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
            case "$REF" in
              s3m-three@*)    PKG="s3m-three" ;;
              s3m-maplibre@*) PKG="s3m-maplibre" ;;
              v*)             PKG="s3m-maplibre" ;;
              *) echo "::error::无法识别的标签格式：$REF"; exit 1 ;;
            esac
          fi
          echo "target=$PKG" >> "$GITHUB_OUTPUT"
          echo "发布目标：$PKG"

      # 标签版本必须与对应包的 package.json 一致，防止改完代码忘了改版本号
      - name: Verify tag matches package version
        if: github.event_name != 'workflow_dispatch'
        run: |
          PKG="${{ steps.resolve.outputs.target }}"
          REF="${GITHUB_REF#refs/tags/}"
          case "$REF" in
            s3m-three@*)    TAG="${REF#s3m-three@}" ;;
            s3m-maplibre@*) TAG="${REF#s3m-maplibre@}" ;;
            v*)             TAG="${REF#v}" ;;
          esac
          PKGVER="$(node -p "require('./packages/$PKG/package.json').version")"
          if [ "$TAG" != "$PKGVER" ]; then
            echo "::error::标签 $REF 与 packages/$PKG 的版本 $PKGVER 不一致，已终止发布"
            exit 1
          fi
          echo "版本一致：$PKG@$PKGVER"

      # 两个包的 x/y 必须同步（只有 patch 各自独立），见 AGENTS.md#版本
      - name: Verify cross-package version sync
        run: node tools/release.mjs --check

      - name: Build and typecheck
        run: |
          npm run build
          npm run typecheck

      # s3m-maplibre 发布时依赖会写成 ^x.y.z（prepublishOnly 替换 workspace:*），
      # 内核不在 npm 上就会装不上，先挡一道
      - name: Verify s3m-three dependency is on npm
        if: steps.resolve.outputs.target == 's3m-maplibre'
        run: |
          DEP="$(node -p "require('./packages/s3m-maplibre/package.json').dependencies['s3m-three']")"
          DEP="${DEP#workspace:}"
          if npm view "s3m-three@$DEP" version >/dev/null 2>&1; then
            echo "依赖已就绪：s3m-three@$DEP"
          else
            echo "::error::npm 上不存在 s3m-three@$DEP —— 请先打标签发布 s3m-three@$DEP（git tag s3m-three@$DEP && git push origin s3m-three@$DEP）"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/${{ steps.resolve.outputs.target }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true

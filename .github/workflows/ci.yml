name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: |
          node tools/test-batch-texmatrix.mjs
          node tools/test-texture-format.mjs
          node tools/test-ortho.mjs
          node tools/test-instanced.mjs
          node tools/test-regressions.mjs
          node tools/test-new-features.mjs
